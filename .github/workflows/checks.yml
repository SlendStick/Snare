name: Code checks

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  gdscript:
    name: GDScript format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gdtoolkit
        run: pip install gdtoolkit==4.5.0
      - name: Check formatting
        run: find scripts -name '*.gd' -print0 | xargs -0 gdformat --check
      - name: Lint scripts
        run: find scripts -name '*.gd' -print0 | xargs -0 gdlint

  godot-import:
    name: Godot 4.3 headless import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Import project and parse resources
        run: |
          set -o pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --editor --quit-after 20 --path . 2>&1 | tee godot-import.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Godot exited with status $status"
          fi
          while IFS= read -r line; do
            echo "::error title=Godot diagnostic::$line"
          done < <(grep -Ei 'error|warning.*(gd|tscn|gdshader)' godot-import.log || true)
          if [ "$status" -ne 0 ] || grep -Eqi 'error' godot-import.log; then
            echo "Godot reported resource errors"
            exit 1
          fi
      - name: Smoke run the game
        run: |
          set -o pipefail
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 30 2>&1 | tee godot-run.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Game exited with status $status"
          fi
          while IFS= read -r line; do
            echo "::error title=Runtime diagnostic::$line"
          done < <(grep -Ei 'script error|parse error|error:' godot-run.log || true)
          if [ "$status" -ne 0 ] || grep -Eqi 'script error|parse error|error:' godot-run.log; then
            echo "Game reported runtime errors"
            exit 1
          fi
