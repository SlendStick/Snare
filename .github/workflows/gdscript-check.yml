name: GDScript Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gdscript-parse:
    name: Parse GDScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdtoolkit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdtoolkit==4.*"

      - name: Parse all GDScript files
        run: |
          set -euo pipefail
          files=$(find . -name '*.gd' -not -path './.git/*' -not -path './.godot/*' | sort)
          if [ -z "$files" ]; then
            echo "No GDScript files found."
            exit 0
          fi
          echo "$files"
          echo "$files" | xargs -r gdparse
